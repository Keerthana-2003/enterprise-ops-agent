apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-stable
  namespace: ops-agent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agent-stable}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
