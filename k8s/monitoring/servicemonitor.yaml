# Requires the Prometheus Operator (kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent
  namespace: ops-agent
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels: {app: agent}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
