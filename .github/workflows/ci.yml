name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Unit tests (offline, scripted LLM)
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate

  cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-cdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Synthesize CloudFormation
        run: npx --yes aws-cdk@2 synth --quiet

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t enterprise-ops-agent .
      - name: Smoke test /health
        run: |
          docker run -d -p 8000:8000 --name agent enterprise-ops-agent
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs agent; exit 1
